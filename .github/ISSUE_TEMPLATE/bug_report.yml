name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a **security** problem, stop here and follow
        [SECURITY.md](https://github.com/mynameishaheer/phonedrop/blob/main/SECURITY.md) instead.
        If you just need setup help, ask in [Discussions](https://github.com/mynameishaheer/phonedrop/discussions).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`. For example "Windows 11 23H2".
    validations:
      required: true
  - type: input
    id: phonedrop-version
    attributes:
      label: PhoneDrop version
      description: Right-click phonedrop.exe (in %LOCALAPPDATA%\PhoneDrop), Properties, Details, Product version. A signed `GET /v1/ping` from the phone also reports it.
      placeholder: "0.9.2"
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      description: Settings, General, About. Leave blank if the problem is PC-only.
      placeholder: "18.1"
  - type: dropdown
    id: shortcut
    attributes:
      label: Which shortcut?
      options:
        - PhoneDrop Setup
        - Send to PC
        - Send Text to PC
        - Send Latest Screenshot
        - Receive from PC
        - PhoneDrop Sign (helper)
        - None, the problem is on the PC
      multiple: true
  - type: dropdown
    id: shortcut-source
    attributes:
      label: Where did you get the shortcuts?
      options:
        - Built by hand from docs/SHORTCUTS.md
        - Imported (generated by shortcuts/build.py)
        - Other
  - type: textarea
    id: phone-showed
    attributes:
      label: What did the phone show?
      description: The exact alert text or response (for example `unauthorized`), or a screenshot.
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from the log
      description: |
        Open `%LOCALAPPDATA%\PhoneDrop\phonedrop.log` and paste the lines around the problem. The log is
        recreated each time PhoneDrop starts, so reproduce the problem first. It never contains secrets,
        file names or text contents, but have a look before you post.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: The tray panel says "Ready to receive", and the phone and PC are on the same Wi-Fi (or I explain below why not).
