name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write     # attach the exe to tagged releases
  id-token: write     # build-provenance attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./... && GOOS=windows GOARCH=amd64 go vet .
      - name: Test
        run: go test -race ./...
      - name: Build phonedrop.exe
        run: ./build.sh
      - name: Checksums
        run: sha256sum phonedrop.exe install.ps1 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: phonedrop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: phonedrop
          path: |
            phonedrop.exe
            install.ps1
            SHA256SUMS.txt
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" phonedrop.exe install.ps1 SHA256SUMS.txt --title "PhoneDrop $GITHUB_REF_NAME" --notes "See README for setup." || \
          gh release upload "$GITHUB_REF_NAME" phonedrop.exe install.ps1 SHA256SUMS.txt --clobber
