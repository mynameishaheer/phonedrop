<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="t d">
  <title id="t">How PhoneDrop works</title>
  <desc id="d">An iPhone sends a signed request over the same Wi-Fi to a Windows PC. A stranger on the same Wi-Fi gets a 401 and nothing else.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4da3ff"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a80"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eaf1fb; }
    .big { font-size: 20px; font-weight: 600; }
    .sub { font-size: 13px; fill: #a9bbd6; }
    .lbl { font-size: 14px; }
    .bad { fill: #ffb4ab; }
  </style>
  <rect width="720" height="250" rx="16" fill="#16233a"/>
  <rect x="30" y="40" width="190" height="90" rx="12" fill="#23395c" stroke="#4da3ff" stroke-width="2"/>
  <text x="125" y="78" text-anchor="middle" class="big">iPhone</text>
  <text x="125" y="102" text-anchor="middle" class="sub">Shortcuts, no app</text>
  <rect x="500" y="40" width="190" height="90" rx="12" fill="#23395c" stroke="#4da3ff" stroke-width="2"/>
  <text x="595" y="78" text-anchor="middle" class="big">Windows PC</text>
  <text x="595" y="102" text-anchor="middle" class="sub">PhoneDrop tray exe</text>
  <line x1="224" y1="85" x2="494" y2="85" stroke="#4da3ff" stroke-width="3" marker-end="url(#ok)"/>
  <text x="360" y="68" text-anchor="middle" class="lbl">signed request</text>
  <text x="360" y="110" text-anchor="middle" class="sub">same Wi-Fi, no server in between</text>
  <rect x="250" y="170" width="220" height="56" rx="12" fill="#2b2f3a" stroke="#ff8a80" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="194" text-anchor="middle" class="lbl">Stranger on the Wi-Fi</text>
  <text x="360" y="214" text-anchor="middle" class="sub">unsigned, so 401</text>
  <path d="M470 198 H595 V136" fill="none" stroke="#ff8a80" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#no)"/>
  <text x="606" y="162" class="lbl bad">401</text>
  <text x="606" y="180" class="sub">nothing shown</text>
</svg>
